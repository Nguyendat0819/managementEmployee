# ============================================================
#  Server
# ============================================================
server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/leave-service}
  shutdown: graceful
  forward-headers-strategy: framework

# ============================================================
#  Spring Application
# ============================================================
spring:
  application:
    name: leave_service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # HttpClient (RestClient) timeout chung cho mọi service khác
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s

  # ============================================================
  #  Database (PostgreSQL) — bật khi dùng JPA
  # ============================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres}
    username: ${DB_USERNAME:postgres.hyxfagucrfgjjtktmtuh}
    password: "${DB_PASSWORD:Nguyendat809@Hr}"
    driver-class-name: org.postgresql.Driver
    hikari:
      # The shared Supabase session pool is limited to 15 clients across services.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:2}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 120000
      pool-name: HikariPool-LeaveService

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
        format_sql: true
        enable_lazy_load_no_trans: true
    database: postgresql
    show-sql: ${JPA_SHOW_SQL:false}

  # ============================================================
  #  Jackson
  # ============================================================
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh
    deserialization:
      fail-on-unknown-properties: false

# ============================================================
#  Actuator + Observability
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false

# ============================================================
#  Logging
# ============================================================
logging:
  level:
    root: INFO
    com.example.leave_service: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: ${JPA_SHOW_SQL:false}
  pattern:
    level: "%5p [req=%X{requestId:-} username=%X{username:-} traceId=%X{traceId:-}]"

# ============================================================
#  SpringDoc / OpenAPI
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# ============================================================
#  Cấu hình riêng của app
# ============================================================
app:
  # Bật/tắt Spring Security tầng filter (true ở prod; false ở local/test nếu cần)
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
    cache:
      enabled: true
  # Refresh cache role -> permission (stub mặc định: không gọi được service nào)
  admin:
    refresh-ms: 60000

  # Log giới hạn ký tự mỗi body (LogExecutionAspect)
  log:
    max-payload-length: 1000

  # HttpClient cho group "internal" (cổng gateway nội bộ)
  internal:
    enabled: true
    base-url: ${INTERNAL_BASE_URL:http://localhost:8088}

  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: ${APP_JWT_ISSUER:hrm-auth}
    access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:PT1H}

# ============================================================
#  Mapping cho @HttpExchange client
# ============================================================
service:
  admin-service:
    context-path: admin
    endpoints:
      get-permission: /api/v1/role-permission/all
