# ============================================================
#  application-dev.yaml — profile mặc định cho local dev
#  CHẠY KHÔNG CẦN DATABASE THẬT.
#
#  Cách hoạt động:
#    - app.database.enabled=false  →  không khởi tạo JPA/JDBC,
#      JwtAuditingConfig không kích hoạt.
#    - spring.autoconfigure.exclude  →  tắt hẳn các DataSource/JPA
#      autoconfig để không ném lỗi "Failed to configure a DataSource".
#
#  Khi nào bật DB:
#    - Khi dự án có @Entity / @Repository đầu tiên cần lưu DB,
#      đổi app.database.enabled=true và bật lại spring.datasource
#      trong application.yaml (hoặc tạo application-<tên>.yaml).
# ============================================================

spring:
  # Tắt auth khi dev local — đỡ phải dựng Keycloak + cấp token mỗi lần test.
  # (Mọi request đều permitAll, nhưng SecurityContext + MdcLoggingFilter vẫn hoạt động,
  # SecurityUtil.getCurrentUsername() trả về "anonymous".)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9999/realms/hrManagement}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:9999/realms/hrManagement/protocol/openid-connect/certs}

logging:
  level:
    com.example.employee_service: DEBUG
    org.springframework.security: INFO

app:
  # ----------------------------------------------------------
  #  Cờ bật/tắt toàn bộ tầng DB ở app-level
  #  - JpaAuditingConfig chỉ load khi true (mặc định true).
  # ----------------------------------------------------------
  database:
    enabled: ${APP_DATABASE_ENABLED:true}

  security:
    enabled: ${APP_SECURITY_ENABLED:false}   # dev: tắt filter chain để test endpoint dễ
    cache:
      enabled: true