spring:
  datasource:
    url: jdbc:h2:mem:attendance_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS hr_service
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database: h2
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  security:
    enabled: false
  jwt:
    secret: test-only-secret-with-at-least-thirty-two-characters
